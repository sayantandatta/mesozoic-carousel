name: Find clear-background pictures

on:
  push:
    branches: [main]
    paths:
      - "scripts/find_clear.py"
      - ".github/workflows/find-clear.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: find-clear
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Score Commons pictures by background
        run: |
          set -o pipefail
          python scripts/find_clear.py 2>&1 | tee clear-log.txt
      - name: Commit candidates and review sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv clear-log.txt data/clear-log.txt
          git add data review
          git diff --cached --quiet && echo "No changes" || git commit -m "Clear-background candidates and review sheets"
          git pull --rebase origin main
          git push
