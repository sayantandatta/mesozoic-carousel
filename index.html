<style>
/* Layout: one centred column; a 3D stage where each specimen card swivels in from the right, placard under the picture. */
:root{
  --bg:#E7ECE1; --surface:#F8FAF4; --ink:#1B2620; --muted:#56655A; --line:#CBD4C5;
  --accent:#A9561A; --accent-ink:#FFF8EE;
  --herb:#367534; --carn:#AE3424; --omni:#6F4F98;
  --tri:#D9A36C; --jur:#6FA67E; --cre:#C98B6E;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101712; --surface:#18211B; --ink:#E5ECE1; --muted:#98A79B; --line:#2B3A30;
    --accent:#F0A24A; --accent-ink:#1B1206;
    --herb:#7DC56E; --carn:#F2806A; --omni:#B99DE2;
    --tri:#C99161; --jur:#5E9670; --cre:#B97D63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#18211B; --ink:#E5ECE1; --muted:#98A79B; --line:#2B3A30;
  --accent:#F0A24A; --accent-ink:#1B1206;
  --herb:#7DC56E; --carn:#F2806A; --omni:#B99DE2;
  --tri:#C99161; --jur:#5E9670; --cre:#B97D63;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 32px;
}
.wrap{max-width:760px; margin:0 auto; display:grid; gap:18px}
header{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:12px 20px}
.brand{min-width:0}
.brand h1{
  margin:0; font-family:var(--f-display); font-weight:800; font-stretch:78%;
  font-size:clamp(1.9rem, 6vw, 2.7rem); line-height:.95; letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:6px 0 0; color:var(--muted); font-size:.95rem; max-width:44ch}
.controls{display:flex; flex-wrap:wrap; gap:8px}
button{
  font:600 .95rem/1 var(--f-body); color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line); border-radius:999px; padding:11px 16px; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px; min-height:44px;
}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
button svg{width:18px; height:18px; flex:none}
button[aria-pressed="false"] .on{display:none}
button[aria-pressed="true"] .off{display:none}

.stage{position:relative; display:grid; perspective:1400px; perspective-origin:50% 40%}
.card{
  grid-area:1/1; min-width:0; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; overflow:hidden; transform-origin:50% 50%;
  backface-visibility:hidden; box-shadow:0 18px 40px -24px rgb(0 0 0 / .45);
}
.frame{position:relative; aspect-ratio:5/3; max-width:100%; background:#1d2a22; overflow:hidden}
.frame canvas{display:block; width:100%; height:100%}
.frame .photo-bg{position:absolute; inset:-20px; background-size:cover; background-position:center; filter:blur(18px) brightness(.55)}
.frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.tag{
  position:absolute; left:12px; top:12px; font:500 .72rem/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase;
  background:rgb(255 255 255 / .82); color:#1B2620; padding:6px 9px; border-radius:6px;
}
.credit{
  position:absolute; right:10px; bottom:8px; font:500 .7rem/1 var(--f-mono); color:#fff;
  background:rgb(0 0 0 / .45); padding:5px 7px; border-radius:5px; text-decoration:none;
}
.placard{padding:16px 18px 18px; display:grid; gap:10px}
.name-row{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 14px}
.name-row h2{
  margin:0; min-width:0; font-family:var(--f-display); font-weight:800; font-stretch:75%;
  font-size:clamp(1.6rem, 6.4vw, 2.5rem); line-height:1; letter-spacing:-.005em; overflow-wrap:anywhere;
}
.name-row h2 i{font-style:normal; font-weight:600; color:var(--muted)}
.diet{
  font:700 .78rem/1 var(--f-body); letter-spacing:.07em; text-transform:uppercase;
  padding:7px 10px; border-radius:999px; border:1.5px solid currentColor; white-space:nowrap;
}
.diet.herb{color:var(--herb)} .diet.carn{color:var(--carn)} .diet.omni{color:var(--omni)}
.say{margin:-4px 0 0; font:500 .82rem/1.3 var(--f-mono); color:var(--muted); letter-spacing:.02em}
.eats{margin:0; font-size:1.05rem; max-width:62ch}
.eats b{font-weight:700}
.facts{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px 18px; margin:2px 0 0}
.facts div{min-width:0}
.facts dt{font:600 .7rem/1.2 var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.facts dd{margin:2px 0 0; font:500 .92rem/1.3 var(--f-mono); font-variant-numeric:tabular-nums}
.timeline{display:grid; gap:4px; margin-top:2px}
.bar{position:relative; display:flex; height:12px; border-radius:3px; overflow:hidden}
.bar span{height:100%}
.bar .mark{position:absolute; top:-1px; bottom:-1px; background:var(--ink); border-radius:2px; min-width:4px; box-shadow:0 0 0 2px var(--surface)}
.bar-labels{display:flex; font:500 .66rem/1 var(--f-mono); color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.bar-labels span{overflow:hidden; white-space:nowrap}

.status{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; color:var(--muted); font-size:.9rem}
.speaking{display:inline-flex; align-items:center; gap:8px}
.wave{display:inline-flex; align-items:center; gap:3px; height:16px}
.wave i{width:3px; height:4px; background:var(--accent); border-radius:2px}
.is-speaking .wave i{animation:wave .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s} .wave i:nth-child(3){animation-delay:.3s} .wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:4px}50%{height:16px}}
.count{font-family:var(--f-mono); font-size:.82rem; font-variant-numeric:tabular-nums}

.start{
  position:absolute; z-index:5; left:50%; top:20%; transform:translate(-50%,-50%); white-space:nowrap;
  background:var(--accent); color:var(--accent-ink); border:none; font-size:1.05rem; padding:16px 22px;
  box-shadow:0 10px 30px -10px rgb(0 0 0 / .6);
}
.start svg{width:22px; height:22px}
.note{margin:0; color:var(--muted); font-size:.85rem; max-width:65ch}
@media (max-width:480px){ .start{font-size:.95rem; padding:12px 16px; top:16%} }
@media (prefers-reduced-motion: reduce){ .is-speaking .wave i{animation:none; height:10px} }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
</head>

const W=800, H=480, G=420, D2R=Math.PI/180;
function hexRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,a){const c=hexRgb(h).map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a));return `rgb(${c[0]},${c[1]},${c[2]})`}

function rng(seedStr){let h=1779033703;for(const ch of seedStr)h=Math.imul(h^ch.charCodeAt(0),3432918353),h=h<<13|h>>>19;
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const sm=t=>t*t*(3-2*t);

function sampleSpine(pts){
  const P=[pts[0],...pts,pts[pts.length-1]], out=[];
  for(let i=1;i<P.length-2;i++){
    const [p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];
    for(let j=0;j<18;j++){
      const t=j/18,t2=t*t,t3=t2*t;
      const f=k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);
      const s=sm(t);
      out.push({x:f(0),y:f(1),up:p1[2]+(p2[2]-p1[2])*s,down:p1[3]+(p2[3]-p1[3])*s});
    }
  }
  const l=pts[pts.length-1]; out.push({x:l[0],y:l[1],up:l[2],down:l[3]});
  let acc=0;
  out.forEach((p,i)=>{
    const a=out[Math.max(0,i-1)], b=out[Math.min(out.length-1,i+1)];
    let tx=b.x-a.x, ty=b.y-a.y, m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    p.tx=tx; p.ty=ty; p.nx=-ty; p.ny=tx;
    if(i) acc+=Math.hypot(p.x-out[i-1].x,p.y-out[i-1].y); p.d=acc;
  });
  out.forEach(p=>p.u=p.d/acc);
  return out;
}
function at(S,u){let i=0;while(i<S.length-1&&S[i+1].u<u)i++;return S[Math.min(i,S.length-1)]}
const topPt=(p,f=1)=>[p.x-p.nx*p.up*f,p.y-p.ny*p.up*f];
const botPt=(p,f=1)=>[p.x+p.nx*p.down*f,p.y+p.ny*p.down*f];

function bodyPath(ctx,S){
  ctx.beginPath();
  S.forEach((p,i)=>{const q=topPt(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});
  for(let i=S.length-1;i>=0;i--){const q=botPt(S[i]);ctx.lineTo(q[0],q[1])}

}
function smooth(ctx,pts){
  const n=pts.length, mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  ctx.beginPath(); const m0=mid(pts[n-1],pts[0]); ctx.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){const p=pts[i],m=mid(p,pts[(i+1)%n]);ctx.quadraticCurveTo(p[0],p[1],m[0],m[1])}

}
function poly(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
function fillStroke(ctx,fill,line,lw){ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=line;ctx.lineWidth=lw;ctx.lineJoin="round";ctx.stroke()}

function limbPts(L,ground){
  let k=1;
  if(ground!=null){let vy=0;L.segs.forEach(s=>vy+=s[0]*Math.sin(s[1]*D2R));const fw=L.segs[L.segs.length-1][2];k=(ground-fw*.45-L.hip[1])/vy}
  let x=L.hip[0],y=L.hip[1]; const pts=[[x,y]];
  L.segs.forEach(s=>{x+=Math.cos(s[1]*D2R)*s[0]*k;y+=Math.sin(s[1]*D2R)*s[0]*k;pts.push([x,y])});
  return pts;
}

  const segs=L.segs, fw=segs[segs.length-1][2], e=pts[pts.length-1];
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(const pass of [0,1]){
    ctx.strokeStyle=pass?fill:line;
    for(let i=0;i<segs.length;i++){ctx.lineWidth=segs[i][2]+(pass?0:5);ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[i+1][0],pts[i+1][1]);ctx.stroke()}
    if(L.foot){ctx.lineWidth=fw*.85+(pass?0:5);ctx.beginPath();ctx.moveTo(e[0]-fw*.2,e[1]);ctx.lineTo(e[0]+L.foot,e[1]+1);ctx.stroke()}

  if(L.claw){ // sickle claw
    ctx.strokeStyle=line;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(e[0]+6,e[1]-4);ctx.quadraticCurveTo(e[0]+14,e[1]-22,e[0]+24,e[1]-14);ctx.stroke();

}
function drawArm(ctx,A,fill,line,d,dx=0,dy=0){
  const L={hip:[A.at[0]+dx,A.at[1]+dy],segs:A.segs};const pts=limbPts(L,null);
  if(A.feathers){ // feather fan hanging from forearm
    const [a,b,c]=pts; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],c[1]);
    ctx.quadraticCurveTo(c[0]-6,c[1]+26,b[0]-22,b[1]+20); ctx.quadraticCurveTo(a[0]-20,a[1]+16,a[0],a[1]); ctx.closePath();
    fillStroke(ctx,dx?shade(d.feather,-.25):d.feather,line,2.5);
  }
  drawLimb(ctx,L,pts,fill,line);
  const e=pts[pts.length-1];
  ctx.strokeStyle=line; ctx.lineWidth=2.4; ctx.lineCap="round";
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(e[0]+7+i*2,e[1]+7+i*3);ctx.stroke()}
  if(A.thumb){ctx.beginPath();ctx.moveTo(e[0]-4,e[1]-3);ctx.lineTo(e[0]+2,e[1]-20);ctx.lineTo(e[0]+6,e[1]-2);ctx.closePath();fillStroke(ctx,d.horn,line,2)}
}

const SCENES={
  tri:{skyTop:"#EFB676",skyBot:"#FBE5BC",sun:"#FFF4D8",far:"#D9A772",near:"#C48956",ground:"#B88551",plant:"#66733A",plant2:"#8A8744"},

function conifer(ctx,x,b,h,c){ctx.fillStyle=shade(c,-.3);ctx.fillRect(x-h*.04,b-h*.25,h*.08,h*.25);ctx.fillStyle=c;
  for(let i=0;i<3;i++){const y=b-h*.2-i*h*.24,w=h*(.34-i*.08);ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x,y-h*.42);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill()}}

  for(let i=0;i<7;i++){const a=(-80+i*26+(r()-.5)*10)*D2R,len=s*(.7+r()*.4);ctx.lineWidth=Math.max(2,s*.07);
    const ex=x+Math.sin(a)*len,ey=b-Math.cos(a)*len*.8;ctx.beginPath();ctx.moveTo(x,b);ctx.quadraticCurveTo(x+Math.sin(a)*len*.5,b-len*.9,ex,ey+len*.25);ctx.stroke();
    ctx.lineWidth=Math.max(1.2,s*.035);
    for(let k=1;k<6;k++){const t=k/6,px=x+(ex-x)*t,py=b+(ey+len*.25-b)*t-Math.sin(t*Math.PI)*len*.35;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+6*(1-t)+2,py+8*(1-t)+3);ctx.moveTo(px,py);ctx.lineTo(px-6*(1-t)-2,py+6*(1-t)+3);ctx.stroke()}}}
function cycad(ctx,x,b,h,c){ctx.fillStyle=shade(c,-.35);ctx.beginPath();ctx.moveTo(x-h*.07,b);ctx.lineTo(x-h*.05,b-h*.55);ctx.lineTo(x+h*.05,b-h*.55);ctx.lineTo(x+h*.07,b);ctx.fill();
  ctx.strokeStyle=c;ctx.lineCap="round";ctx.lineWidth=h*.06;for(let i=0;i<7;i++){const a=(-150+i*20)*D2R;ctx.beginPath();ctx.moveTo(x,b-h*.55);ctx.quadraticCurveTo(x+Math.cos(a)*h*.3,b-h*.55+Math.sin(a)*h*.45,x+Math.cos(a)*h*.55,b-h*.4+Math.sin(a)*h*.15);ctx.stroke()}}
function drawScene(ctx,key,seed){
  const P=SCENES[key], r=rng(seed);
  let g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,P.skyTop);g.addColorStop(1,P.skyBot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=P.sun;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(640+r()*80,80+r()*30,38,0,7);ctx.fill();ctx.globalAlpha=1;
  if(key==="cre"){ctx.fillStyle=shade(P.far,-.12);ctx.beginPath();ctx.moveTo(60,330);ctx.lineTo(190,190);ctx.lineTo(230,190);ctx.lineTo(380,330);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.35)";[[210,170,18],[226,148,24],[250,120,30]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill()})}
  const ph=r()*6;
  ctx.fillStyle=P.far;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,318+22*Math.sin(x*.008+ph)+10*Math.sin(x*.023+ph*2));ctx.lineTo(W,H);ctx.fill();
  for(let i=0;i<7;i++){const x=r()*W;conifer(ctx,x,322+12*Math.sin(x*.008+ph),40+r()*30,shade(P.far,-.25))}
  ctx.fillStyle=P.near;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,368+14*Math.sin(x*.012+ph*1.7)+6*Math.sin(x*.04));ctx.lineTo(W,H);ctx.fill();
  if(key!=="tri") for(let i=0;i<4;i++){const x=40+r()*720;conifer(ctx,x,372,60+r()*40,shade(P.near,-.3))}
  g=ctx.createLinearGradient(0,400,0,H);g.addColorStop(0,P.ground);g.addColorStop(1,shade(P.ground,-.25));ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,404+3*Math.sin(x*.05+ph));ctx.lineTo(W,H);ctx.fill();
  ctx.fillStyle=shade(P.ground,-.15);for(let i=0;i<40;i++){ctx.fillRect(r()*W,410+r()*66,6+r()*12,2)}
}
function drawForeground(ctx,key,seed){
  const P=SCENES[key], r=rng(seed+"fg");
  if(key==="tri"){cycad(ctx,40,H-6,110,P.plant2);fern(ctx,770,H-4,70,P.plant,r)}
  else{fern(ctx,30,H-2,80,P.plant,r);fern(ctx,780,H-2,70,P.plant2,r);cycad(ctx,740,H-4,90,P.plant)}

}

function drawDino(ctx,d){
  const S=sampleSpine(d.spine), line=shade(d.body,-.55), far=shade(d.body,-.25);
  const xs=S.map(p=>p.x); const cx=(Math.min(...xs)+Math.max(...xs))/2;
  ctx.fillStyle="rgba(25,30,18,.25)";ctx.beginPath();ctx.ellipse(cx+20,G+4,(Math.max(...xs)-Math.min(...xs))*.38,11,0,0,7);ctx.fill();
  const legs=d.legs.map(L=>({L,pts:limbPts(L,L.far?G-7:G)}));
  legs.filter(o=>o.L.far).forEach(o=>drawLimb(ctx,o.L,o.pts,far,line));
  (d.arms||[]).forEach(A=>drawArm(ctx,A,far,line,d,-10,-4));
  // behind-body features
  if(d.plates){const o=d.plates;
    for(const row of [1,0]){for(let i=0;i<o.n;i++){
      const u=o.from+(o.to-o.from)*(i+(row?.5:0))/(o.n-1); if(u>o.to+.01)continue;
      const p=at(S,u),hh=o.max*(.45+.55*Math.pow(Math.sin(Math.PI*(i+.5)/o.n),.8))*(row?.82:1),w=hh*.62;
      const [bx,by]=topPt(p,.55),ox=-p.nx,oy=-p.ny;
      smooth(ctx,[[bx-p.tx*w*.5,by-p.ty*w*.5],[bx+ox*hh*.55-p.tx*w*.55,by+oy*hh*.55-p.ty*w*.55],[bx+ox*hh*1.25+p.tx*w*.1,by+oy*hh*1.25+p.ty*w*.1],[bx+ox*hh*.55+p.tx*w*.55,by+oy*hh*.55+p.ty*w*.55],[bx+p.tx*w*.5,by+p.ty*w*.5]]);
      fillStroke(ctx,row?shade(d.plate,-.25):d.plate,line,2.4);}}
  }
  if(d.spikes){d.spikes.at.forEach((u,i)=>{const p=at(S,u),[bx,by]=topPt(p,.6);
    for(const s of [-1,1]){const a=Math.atan2(-p.ny,-p.nx)+(s<0?-.55:-.95)*(i?1:1.15),L=58-i*8;
      poly(ctx,[[bx-p.tx*7,by-p.ty*7],[bx+Math.cos(a)*L,by+Math.sin(a)*L],[bx+p.tx*7,by+p.ty*7]]);fillStroke(ctx,s<0?d.horn:shade(d.horn,-.2),line,2.2)}})}
  if(d.sailOpt){const o=d.sailOpt,pts=[],base=[];
    for(let k=0;k<=24;k++){const u=o.from+(o.to-o.from)*k/24,p=at(S,u),hh=o.max*Math.pow(Math.sin(Math.PI*k/24),.7)*(1-.25*k/24),[bx,by]=topPt(p,.7);base.push([bx,by]);pts.push([bx-p.nx*hh,by-p.ny*hh])}
    ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));for(let i=base.length-1;i>=0;i--)ctx.lineTo(base[i][0],base[i][1]);ctx.closePath();
    const sg=ctx.createLinearGradient(0,60,0,240);sg.addColorStop(0,shade(d.sail,-.15));sg.addColorStop(1,d.sail);fillStroke(ctx,sg,line,2.5);
    ctx.strokeStyle=rgba("3a2418",.35);ctx.lineWidth=2;for(let i=2;i<pts.length-1;i+=2){ctx.beginPath();ctx.moveTo(base[i][0],base[i][1]);ctx.lineTo(pts[i][0]*.92+base[i][0]*.08,pts[i][1]*.92+base[i][1]*.08);ctx.stroke()}}
  if(d.tailFeathers){const p=at(S,.04);for(let i=-2;i<=2;i++){ctx.save();ctx.translate(p.x+4,p.y);ctx.rotate(Math.atan2(-p.ty,-p.tx)+i*.16);ctx.beginPath();ctx.ellipse(18,0,30,6,0,0,7);fillStroke(ctx,i%2?shade(d.feather,-.2):d.feather,line,2);ctx.restore()}}
  // body
  bodyPath(ctx,S); ctx.fillStyle=d.body; ctx.fill();
  ctx.save(); bodyPath(ctx,S); ctx.clip();
  const ys=S.map(p=>p.y); const bg=ctx.createLinearGradient(0,Math.min(...ys)-40,0,Math.max(...ys)+70);
  bg.addColorStop(0,"rgba(255,255,255,.10)");bg.addColorStop(.5,"rgba(255,255,255,0)");bg.addColorStop(.62,rgba(d.belly,0));bg.addColorStop(.95,rgba(d.belly,.95));
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(d.stripes){ctx.fillStyle=rgba("1a140c",.16);for(let u=.08;u<.82;u+=.055){const a=at(S,u),b=at(S,u+.018),c=at(S,u+.03);
    const p1=topPt(a,1.1),p2=topPt(c,1.1),p3=[c.x+c.nx*c.down*.05,c.y+c.ny*c.down*.05],p4=[a.x-a.nx*a.up*.15,a.y-a.ny*a.up*.15];poly(ctx,[p1,p2,p3,p4]);ctx.fill()}}
  if(d.armorRows){const o=d.armorRows;for(let u=o.from;u<o.to;u+=.035){const p=at(S,u);
    for(const f of [.82,.45,.08]){const q=topPt(p,f);const r=Math.max(4,p.up*.13);ctx.beginPath();ctx.ellipse(q[0],q[1],r*1.25,r,Math.atan2(p.ty,p.tx),0,7);fillStroke(ctx,d.armor,line,1.8)}}}
  ctx.restore();
  bodyPath(ctx,S); ctx.strokeStyle=line; ctx.lineWidth=2.6; ctx.lineJoin="round"; ctx.stroke();
  if(d.armorRows){for(let u=d.armorRows.from;u<d.armorRows.to;u+=.07){const p=at(S,u),[bx,by]=topPt(p,.95);
      poly(ctx,[[bx-p.tx*7,by-p.ty*7],[bx-p.nx*16,by-p.ny*16],[bx+p.tx*7,by+p.ty*7]]);fillStroke(ctx,d.horn,line,2)}
    for(let u=.36;u<.86;u+=.1){const p=at(S,u),[bx,by]=botPt(p,.25);poly(ctx,[[bx-p.tx*8,by-p.ty*8],[bx+p.nx*4-p.tx*18,by+p.ny*4+18],[bx+p.tx*8,by+p.ty*8]]);fillStroke(ctx,d.horn,line,2)}}
  if(d.club){const p=S[2];ctx.beginPath();ctx.ellipse(p.x+6,p.y,30,22,-.15,0,7);fillStroke(ctx,d.armor,line,2.6);
    ctx.beginPath();ctx.ellipse(p.x+2,p.y-4,14,9,-.15,0,7);ctx.fillStyle=rgba("ffffff",.15);ctx.fill()}
  drawHead(ctx,d);
  legs.filter(o=>!o.L.far).forEach(o=>drawLimb(ctx,o.L,o.pts,d.body,line));
  (d.arms||[]).forEach(A=>drawArm(ctx,A,d.body,line,d));
}
function render(canvas,d){
  const dpr=Math.min(2,window.devicePixelRatio||1)*1.25;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  drawScene(ctx,d.scene,d.id); drawDino(ctx,d); drawForeground(ctx,d.scene,d.id);
}

/* ---------- Card ---------- */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function timeline(d){
  const span=252-66, wrap=el("div","timeline"), bar=el("div","bar");
  ERAS.forEach(([n,a,b,c])=>{const s=el("span");s.style.width=((a-b)/span*100)+"%";s.style.background=c;bar.append(s)});
  const m=el("span","mark"); m.style.left=((252-d.ma[0])/span*100)+"%"; m.style.width=((d.ma[0]-d.ma[1])/span*100)+"%"; bar.append(m);
  const lab=el("div","bar-labels");ERAS.forEach(([n,a,b])=>{const s=el("span",null,n);s.style.width=((a-b)/span*100)+"%";lab.append(s)});
  wrap.append(bar,lab); wrap.setAttribute("aria-hidden","true"); return wrap;
}
function makeCard(d){
  const card=el("article","card"); card.setAttribute("aria-live","polite");
  const frame=el("div","frame"); const cv=document.createElement("canvas");
  cv.setAttribute("role","img"); cv.setAttribute("aria-label",`Illustration of ${d.name}${d.sp?" "+d.sp:""}`);
  frame.append(cv); render(cv,d);
  if(d.photo){
    const bgp=el("div","photo-bg"); const img=new Image(); img.alt=`${d.name} fossil photo from Wikipedia`; img.decoding="async";
    img.onload=()=>{bgp.style.backgroundImage=`url("${d.photo}")`; frame.insertBefore(bgp,cv.nextSibling); frame.insertBefore(img,bgp.nextSibling); cv.hidden=true;
      const a=el("a","credit","Photo · Wikipedia"); a.href="https://en.wikipedia.org/wiki/"+encodeURIComponent(d.wiki); a.target="_blank"; a.rel="noopener"; frame.append(a)};
    img.src=d.photo;
  }
  frame.append(el("span","tag",d.period));
  const pl=el("div","placard");
  const row=el("div","name-row"); row.append(el("h2",null,d.name+(d.sp?` <i>${d.sp}</i>`:"")), el("span","diet "+d.diet,DIET_LABEL[d.diet]));
  pl.append(row, el("p","say",d.say), el("p","eats",`<b>What it ate:</b> ${d.eats[0].toUpperCase()+d.eats.slice(1)}.`));
  const facts=el("dl","facts");
  const lived=d.ma[0]===d.ma[1]?`${d.ma[0]}`:`${d.ma[0]}–${d.ma[1]}`;
  facts.innerHTML=`<div><dt>Lived</dt><dd>${lived} million years ago</dd></div><div><dt>Length</dt><dd>about ${d.len}</dd></div>`;
  pl.append(facts, timeline(d));
  card.append(frame,pl); return card;
}

/* ---------- Show loop ---------- */
const stage=document.getElementById("stage"), playBtn=document.getElementById("play"), nextBtn=document.getElementById("next"),
  voiceBtn=document.getElementById("voice"), bigStart=document.getElementById("bigStart"), statusEl=document.getElementById("status"),
  statusText=document.getElementById("statusText"), countEl=document.getElementById("count");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let bag=[], current=-1, shown=0, running=false, voiceOn=true, run=0, timer=null, wake=null, liveUtter=null, busy=false;

function nextIndex(){
  if(!bag.length){bag=[...DINOS.keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
    if(bag[bag.length-1]===current)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}
  return bag.pop();
}
function lineFor(d){return `${d.speak}. It ate ${d.eats}.`}
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){const en=voices.filter(v=>/^en/i.test(v.lang));
  return en.find(v=>/Google UK English Male|Daniel|Samantha|Google US English|Natural/i.test(v.name))||en[0]||null}

function speak(text,done){
  const id=run, start=performance.now(), readMs=Math.max(3200,text.length*62);
  const finish=(err)=>{ if(id!==run)return; clearTimeout(timer);
    const left=err?Math.max(0,readMs-(performance.now()-start)):0; statusEl.classList.remove("is-speaking");
    timer=setTimeout(()=>{if(id===run)done()},left)};
  if(!voiceOn||!("speechSynthesis" in window)){statusText.textContent=voiceOn?"Voice isn't available in this browser.":"Voice is off.";timer=setTimeout(()=>{if(id===run)done()},readMs);return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v)u.voice=v; u.lang=v?v.lang:"en-GB"; u.rate=.92; u.pitch=1.05;
    u.onstart=()=>{if(id===run){statusEl.classList.add("is-speaking");statusText.textContent="Speaking…"}};
    u.onend=()=>finish(false); u.onerror=()=>finish(true);
    liveUtter=u; speechSynthesis.speak(u);
    timer=setTimeout(()=>finish(false),readMs+9000);
  }catch(e){finish(true)}
}
function step(){ // speak current, pause, swivel to next, repeat
  if(!running)return;
  speak(lineFor(DINOS[current]),()=>{ if(!running)return; statusText.textContent="Next one coming…";
    const id=run; timer=setTimeout(()=>{if(id===run&&running)swivel(nextIndex(),true)},1400)});
}
function swivel(idx,thenSpeak){
  if(busy)return; busy=true; run++; clearTimeout(timer); try{speechSynthesis.cancel()}catch(e){}
  statusEl.classList.remove("is-speaking");
  const out=stage.querySelector(".card"), inc=makeCard(DINOS[idx]); current=idx; shown++; countEl.textContent=`Shown: ${shown}`;
  stage.append(inc);
  const dur=reduce?300:950, ease="cubic-bezier(.65,.02,.25,1)";
  const outK=reduce?[{opacity:1},{opacity:0}]:[{transform:"translateX(0) rotateY(0deg) scale(1)",opacity:1},{transform:"translateX(-58%) rotateY(-78deg) scale(.82)",opacity:0}];
  const inK=reduce?[{opacity:0},{opacity:1}]:[{transform:"translateX(58%) rotateY(78deg) scale(.82)",opacity:0},{transform:"translateX(0) rotateY(0deg) scale(1)",opacity:1}];
  if(out) out.animate(outK,{duration:dur,easing:ease,fill:"forwards"});
  const a=inc.animate(inK,{duration:dur,easing:ease});
  const fin=()=>{out&&out.remove();busy=false;if(thenSpeak&&running)step()};
  a.onfinish=fin; a.oncancel=fin;
  // warm the next photo
  if(bag.length){const n=DINOS[bag[bag.length-1]];if(n.photo){const i=new Image();i.src=n.photo}}
}
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function setRunning(on){
  running=on; run++; clearTimeout(timer); try{speechSynthesis.cancel()}catch(e){}
  statusEl.classList.remove("is-speaking");
  playBtn.setAttribute("aria-label",on?"Pause the show":"Start the show");
  document.getElementById("playLabel").textContent=on?"Pause":(shown>1||bigStart.hidden?"Resume":"Start");
  document.getElementById("playIcon").setAttribute("d",on?"M7 5h4v14H7zM13 5h4v14h-4z":"M7 5v14l12-7z");
  bigStart.hidden=true; keepAwake(on);
  if(on){statusText.textContent=voiceOn?"Listen…":"Voice is off.";step()} else statusText.textContent="Paused.";
}
playBtn.onclick=()=>setRunning(!running);
bigStart.onclick=()=>setRunning(true);
nextBtn.onclick=()=>{ if(!running)statusText.textContent="Press Start to hear it."; swivel(nextIndex(),running)};
voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.setAttribute("aria-pressed",String(voiceOn));if(running){run++;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}step()}};
document.addEventListener("keydown",e=>{if(e.target.closest("button"))return;if(e.code==="Space"){e.preventDefault();setRunning(!running)}else if(e.key==="ArrowRight"){nextBtn.click()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running)keepAwake(true)});

/* first card */
current=nextIndex(); shown=1; stage.append(makeCard(DINOS[current]));

/* real photos where Wikipedia is reachable */
(async()=>{
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=1200&redirects=1&titles="+encodeURIComponent(DINOS.map(d=>d.wiki).join("|"));
    const j=await (await fetch(url,{signal:ctl.signal})).json();
    const alias={}; [...(j.query.normalized||[]),...(j.query.redirects||[])].forEach(x=>alias[x.from]=x.to);
    const pics={}; Object.values(j.query.pages||{}).forEach(p=>{if(p.thumbnail)pics[p.title]=p.thumbnail.source});
    let n=0; DINOS.forEach(d=>{let t=d.wiki;while(alias[t])t=alias[t];if(pics[t]){d.photo=pics[t];n++}});
    if(n) document.getElementById("note").textContent="Fossil photos come from Wikipedia. Any dinosaur without a photo is drawn by the page.";
  }catch(e){/* blocked or offline: keep the drawings */}
})();
</script>
